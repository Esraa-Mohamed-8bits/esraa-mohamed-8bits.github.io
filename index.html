<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Detect real Earth-system trends for any place on Earth with NASA Data Rods, NASA AppEEARS, NASA GIBS imagery and NASA GISTEMP. NASA Space Apps 2026.">
<title>Earth Trend Detective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: map-first observation deck. The Earth view (globe → satellite map) fills the first screen; translucent instrument panels float over it
   (explore list left, active section right, timeline bottom). Before & After and the time-lapse sit directly below the map.
   One deliberate light look ("pale mist"): colour carries meaning — coral = heating/drying, blue = cooling/wetting, violet = simulation, amber = your selection. */
:root{
  color-scheme:light;
  /* neutrals, biased toward the teal accent */
  --page:#F2F6F7; --mist:#E6EEF0; --surface:#FFFFFF; --surface2:#F5F8F9; --tint:#E7F3F1; --line:#DAE4E6; --line2:#C3D2D5;
  --ink:#0E2A2F; --muted:#4E666B; --faint:#667C80;
  /* accent pair */
  --teal:#0B6E69; --teal-deep:#08524E; --teal-soft:#D9EFEC; --coral:#E8673F;
  /* semantic */
  --heat:#BF4526; --heat-soft:#FBE5DD; --cool:#2563A6; --cool-soft:#DEEAF7; --dry:#9A5B22; --green:#2E7D4F; --green-soft:#DFF1E6;
  --amber:#D9961A; --violet:#6247B0; --violet-soft:#ECE7F8; --warn:#93580F; --warn-soft:#FFF5E6; --blue:#2563A6; --sky:#DEEAF7; --earth:#9A5B22; --sand:#F4E8D6;
  /* glass */
  --glass:rgba(255,255,255,.74); --glass-strong:rgba(255,255,255,.9); --glass-line:rgba(255,255,255,.75);
  --shadow:0 1px 1px rgba(14,42,47,.04),0 4px 10px rgba(14,42,47,.05),0 18px 40px -12px rgba(14,42,47,.16);
  --shadow-lift:0 2px 2px rgba(14,42,47,.05),0 10px 22px rgba(14,42,47,.08),0 28px 50px -18px rgba(14,42,47,.24);
  --r:18px; --r-sm:12px;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --panelW:452px; --leftW:300px;
  --ease:cubic-bezier(.22,.8,.26,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
a{color:var(--teal);text-underline-offset:2px}
button,input,select{font:inherit;color:inherit}
select,input[type=number],input[type=search],input[type=text]{background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:6px 9px;color:var(--ink)}
:focus-visible{outline:2.5px solid var(--teal);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:650;letter-spacing:-.015em;text-wrap:balance;margin:0;line-height:1.12}
p{margin:0}
.hint{font-size:13px;color:var(--muted)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ic.sm{width:15px;height:15px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px;padding:9px max(16px,env(safe-area-inset-left,0px));background:rgba(250,252,252,.82);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px}
.brand .mark{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#BFEDE3 0,#2FA096 32%,#0B6E69 62%,#06403D 100%);box-shadow:0 0 0 3px rgba(11,110,105,.12),0 0 18px rgba(47,160,150,.45),inset -4px -5px 8px rgba(0,0,0,.25);position:relative;overflow:hidden}
.brand .mark::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(105deg,transparent 52%,rgba(6,30,40,.5) 72%)}
.brand b{font-family:var(--f-display);font-weight:750;font-size:20px;letter-spacing:-.02em;display:block;line-height:1.05}
.brand small{display:block;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
nav.sections{position:relative;display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
nav.sections::-webkit-scrollbar{display:none}
nav.sections button{flex:none;display:inline-flex;align-items:center;gap:7px;border:0;background:none;color:var(--muted);padding:8px 12px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap;transition:color .2s,background .2s}
nav.sections button:hover{color:var(--ink);background:rgba(14,42,47,.04)}
nav.sections button[aria-current="page"]{color:var(--teal);font-weight:650}
.tab-ink{position:absolute;bottom:0;left:0;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--teal),#2FA096);transition:transform .45s var(--ease),width .45s var(--ease);pointer-events:none;width:0}
.hdr-actions{display:flex;gap:6px;align-items:center}
.hbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:11px;padding:7px 12px;cursor:pointer;font-size:13.5px;font-weight:600;white-space:nowrap;transition:transform .2s var(--ease),box-shadow .2s,border-color .2s}
.hbtn:hover{border-color:var(--teal);color:var(--teal);transform:translateY(-1px);box-shadow:var(--shadow)}
.hbtn.accent{background:var(--ink);border-color:var(--ink);color:#fff}
.hbtn.accent:hover{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff}

/* earth view */
.workspace{position:relative;height:calc(100vh - 64px);min-height:640px;max-height:1000px}
.stage{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(ellipse 70% 60% at 50% 46%,#FFFFFF 0%,rgba(255,255,255,0) 60%),
  radial-gradient(ellipse at 18% 12%,#E3F1EE 0%,rgba(227,241,238,0) 45%),
  radial-gradient(ellipse at 85% 90%,#E6ECF6 0%,rgba(230,236,246,0) 50%),
  linear-gradient(180deg,#EEF4F5 0%,#DFE9EC 100%)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(14,42,47,.07) 1px,transparent 1.2px);background-size:22px 22px;mask-image:radial-gradient(ellipse at 50% 50%,transparent 30%,#000 85%);-webkit-mask-image:radial-gradient(ellipse at 50% 50%,transparent 30%,#000 85%);z-index:0}
#globe{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;z-index:1;animation:globeIn 1.4s var(--ease) both}
@keyframes globeIn{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:none}}
#globe:active{cursor:grabbing}
#map{position:absolute;inset:0;touch-action:none;cursor:grab;outline:none;background:#CFE2EC;z-index:1}
#map.off{visibility:hidden}
#map:active{cursor:grabbing}
#map .tiles{position:absolute;inset:0;pointer-events:none}
#map .tiles img{position:absolute;left:0;top:0;max-width:none!important;user-select:none;-webkit-user-drag:none;transform-origin:0 0}
#map canvas,#map svg.marks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#map svg.marks .mk{pointer-events:auto;cursor:pointer}
#map svg.marks .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(3.2);opacity:0}}
.hoverchip{position:absolute;z-index:30;pointer-events:none;background:var(--glass-strong);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-size:13px;white-space:nowrap;transform:translate(14px,-50%);box-shadow:var(--shadow)}
.float{background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--glass-line);outline:1px solid rgba(14,42,47,.06);border-radius:var(--r);box-shadow:var(--shadow)}
@supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){.float{background:var(--glass-strong)}}

.cmd{position:absolute;z-index:22;top:14px;left:calc(var(--leftW) + 32px);right:calc(var(--panelW) + 32px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.cmd .bar{pointer-events:auto;width:min(580px,100%);display:flex;gap:6px;padding:6px;border-radius:16px}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 38px;font-size:15px;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--teal);outline:none;background:var(--surface);box-shadow:0 0 0 4px rgba(11,110,105,.14)}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.sugg{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;z-index:80;box-shadow:var(--shadow-lift);max-height:340px;overflow:auto}
.sugg button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:14.5px}
.sugg button:hover,.sugg button:focus-visible{background:var(--tint)}
.sugg button small{color:var(--muted);font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.sugg p{padding:7px 10px;font-size:13px;color:var(--muted)}
.locbtn{flex:none;display:inline-flex;align-items:center;gap:7px;border:0;background:var(--teal);color:#fff;border-radius:12px;padding:0 15px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;transition:background .2s,transform .2s var(--ease)}
.locbtn:hover{background:var(--teal-deep);transform:translateY(-1px)}
.locbtn[disabled]{opacity:.6}
.cmd .msg{pointer-events:auto;max-width:min(600px,100%);font-size:12.5px;padding:6px 13px;border-radius:999px;background:var(--glass-strong);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);color:var(--muted);text-align:center;box-shadow:var(--shadow)}
.cmd .msg i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--faint);margin-right:7px;vertical-align:1px}
.cmd .msg.busy i{background:var(--teal);animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.cmd .msg.ok i{background:var(--green);box-shadow:0 0 0 3px rgba(46,125,79,.18)} .cmd .msg.warn{color:var(--warn);border-color:#EBD3AE;background:rgba(255,248,236,.95)} .cmd .msg.warn i{background:var(--amber)}

.explore{position:absolute;z-index:16;left:16px;top:14px;width:var(--leftW);max-height:calc(100% - 136px);display:flex;flex-direction:column}
.explore header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.explore header h3{font-size:16px;display:flex;gap:8px;align-items:center}
.explore .body{overflow:auto;padding:6px 8px 10px}
.explore.collapsed .body{display:none}
.explore.collapsed header{border-bottom:0}
.iconbtn{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:3px 10px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.iconbtn:hover{color:var(--ink);border-color:var(--line2)}
.xgroup>.label{display:block;padding:9px 6px 4px}
.xrow{display:flex;align-items:center;gap:2px;border-radius:11px;transition:background .2s}
.xrow:hover{background:rgba(14,42,47,.04)}
.xrow>button[data-x]{flex:1;min-width:0;display:flex;align-items:center;gap:9px;text-align:left;border:0;background:none;padding:7px 8px;border-radius:11px;cursor:pointer;font-size:14px}
.xrow .vi{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff}
.xrow .vi .ic{width:15px;height:15px}
.xrow .rng{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;color:var(--faint);white-space:nowrap}
.xrow>.gi{margin-right:6px}
.xitem.on .xrow{background:var(--teal-soft)}
.xitem.on .xrow>button[data-x]{color:var(--teal-deep);font-weight:650}
.xitem .info{display:none;padding:6px 8px 12px 43px;font-size:13px;color:var(--muted)}
.xitem.on .info{display:block}
.xitem .info dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;margin:8px 0 0}
.xitem .info dt{font-family:var(--f-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding-top:2px}
.xitem .info dd{margin:0;color:var(--ink);font-size:12.5px;min-width:0}
.lg{margin-top:8px}
.lg .bar{height:8px;border-radius:4px}
.lg .ends{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-top:3px}
.basemap{border-top:1px solid var(--line);margin-top:8px;padding:10px 6px 0;display:flex;flex-direction:column;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;padding:2px;background:var(--surface2);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 10px;border-radius:9px;cursor:pointer;font-size:12.5px;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--teal);font-weight:650;box-shadow:0 1px 3px rgba(14,42,47,.12)}
.zoombtns{position:absolute;z-index:15;right:calc(var(--panelW) + 32px);bottom:120px;display:flex;flex-direction:column;gap:6px}
.zoombtns button{width:38px;height:38px;border-radius:12px;border:1px solid var(--glass-line);background:var(--glass-strong);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;font-size:17px;line-height:1;box-shadow:var(--shadow);color:var(--ink);display:grid;place-items:center;transition:transform .2s var(--ease)}
.zoombtns button:hover{transform:translateY(-1px);color:var(--teal)}

.timeline{position:absolute;z-index:17;left:16px;right:calc(var(--panelW) + 32px);bottom:16px;padding:10px 16px;display:flex;align-items:center;gap:14px}
.timeline .yr{display:flex;flex-direction:column;line-height:1;min-width:76px}
.timeline .yr b{font-family:var(--f-display);font-weight:750;font-size:36px;letter-spacing:-.03em;background:linear-gradient(120deg,var(--teal-deep),#2FA096);-webkit-background-clip:text;background-clip:text;color:transparent}
.timeline .yr small{font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:4px;white-space:nowrap}
.track{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.track input{width:100%;accent-color:var(--teal);margin:0}
.ticks{position:relative;height:14px;font-family:var(--f-mono);font-size:10px;color:var(--faint)}
.ticks span{position:absolute;transform:translateX(-50%)}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--surface);padding:7px 13px;border-radius:11px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;transition:transform .2s var(--ease),border-color .2s,color .2s,background .2s,box-shadow .2s}
.btn:hover{border-color:var(--teal);color:var(--teal);transform:translateY(-1px)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 6px 16px -6px rgba(11,110,105,.6)}
.btn.primary:hover{background:var(--teal-deep);color:#fff}
.btn.ghost{background:transparent}
.btn.small{padding:4px 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.play{width:40px;height:40px;padding:0;border-radius:50%}

.panel{position:absolute;z-index:18;right:16px;top:14px;bottom:16px;width:var(--panelW);display:flex;flex-direction:column;overflow:hidden}
.panel .scroll{overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;min-height:0;scroll-behavior:smooth}
.panel .scroll>*{animation:rise .5s var(--ease) both}
.panel .scroll>*:nth-child(2){animation-delay:.04s}.panel .scroll>*:nth-child(3){animation-delay:.08s}.panel .scroll>*:nth-child(4){animation-delay:.12s}.panel .scroll>*:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec-title{display:flex;flex-direction:column;gap:4px}
.sec-title h2{font-size:25px;display:flex;align-items:center;gap:9px}
.sec-title h2 .ic{width:22px;height:22px;color:var(--teal)}
.sec-title p{color:var(--muted);font-size:14px}
.loc{display:flex;flex-direction:column;gap:6px}
.loc h2{font-size:30px;letter-spacing:-.025em}
.loc .coords{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap;line-height:1.2;font-weight:600}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.badge.live,.badge.real{background:var(--green-soft);color:var(--green)} .badge.none{background:var(--surface2);color:var(--muted);border:1px solid var(--line)} .badge.sim{background:var(--violet-soft);color:var(--violet)} .badge.na{background:var(--warn-soft);color:var(--warn)}
.note{border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;border:1px solid var(--line);background:var(--surface2);color:var(--muted)}
.note b{color:var(--ink)}
.note.warn{background:var(--warn-soft);border-color:#EFD9B3;color:#6E4510} .note.warn b{color:#5A3809}
.note.sim{background:var(--violet-soft);border-color:#D9D0F1;color:#46368A} .note.sim b{color:var(--violet)}
.card{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:15px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:0 1px 2px rgba(14,42,47,.04)}
.lift{transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}
.lift:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--line2)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.card-head h3{font-size:18px;display:flex;align-items:center;gap:8px}
.card-head .sub{font-size:13px;color:var(--muted)}
.card svg.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.rangerow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.verdict{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.arrow{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1}
.dir-up{color:var(--heat)} .dir-down{color:var(--cool)} .dir-none{color:var(--muted)}
.verdict b{font-size:16px}
.hero{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.hero .big{font-family:var(--f-display);font-weight:750;font-size:54px;line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.hero .big small{font-size:22px;letter-spacing:-.01em;font-weight:600;margin-left:4px}
.hero .meta{display:flex;flex-direction:column;gap:4px;padding-bottom:4px}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.nums div{border-top:1px solid var(--line);padding-top:6px;min-width:0}
.nums .k{font-family:var(--f-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:3px}
.nums .v{font-family:var(--f-mono);font-size:15px;font-weight:500}
/* two-level explanation */
.two{display:flex;flex-direction:column;gap:0;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line)}
.two .sci{padding:10px 12px;background:var(--surface)}
.two .plain{padding:10px 12px;background:var(--tint);border-top:1px solid var(--line)}
.two .label{display:block;margin-bottom:3px}
.two .plain .label{color:var(--teal-deep)}
.two p{font-size:14px}
details.more{border-top:1px solid var(--line);padding-top:8px}
details.more summary{cursor:pointer;font-size:13.5px;color:var(--teal);font-weight:600}
.terms{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.stattbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.trend-item{border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.trend-item>button{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:11px 12px;cursor:pointer;border-radius:14px}
.trend-item>button .t b{display:block;font-size:14.5px}
.trend-item>button .t span{font-size:12.5px;color:var(--muted)}
.trend-item>button .m{font-family:var(--f-mono);font-size:12.5px;text-align:right;white-space:nowrap}
.trend-item .more{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.sigpill{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;display:inline-block;margin-top:3px;font-weight:600}
.sigpill.yes{background:var(--heat-soft);color:var(--heat)} .sigpill.yes.cool{background:var(--cool-soft);color:var(--cool)} .sigpill.no{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.empty{border:1px dashed var(--line2);border-radius:14px;padding:16px;color:var(--muted);font-size:14px;background:rgba(255,255,255,.6);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;background:var(--surface)}
.checks input{accent-color:var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink);transition:transform .2s var(--ease),border-color .2s,color .2s}
.chips button:hover{border-color:var(--teal);color:var(--teal);transform:translateY(-1px)}
.legendrow{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legendrow span{display:inline-flex;gap:6px;align-items:center}
.legendrow i{width:14px;height:3px;border-radius:2px;display:inline-block}
.tag{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;white-space:nowrap;font-weight:600}
.tag.mech{background:var(--green-soft);color:var(--green)} .tag.co{background:var(--surface2);color:var(--muted)}
code{font-family:var(--f-mono);font-size:11.5px;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:0 4px;word-break:break-all}
ol.list,ul.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px}
/* solutions lab */
.problems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.problem{border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--surface2);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;transition:transform .2s var(--ease),border-color .2s}
.problem:hover{transform:translateY(-1px);border-color:var(--line2)}
.problem b{font-size:14.5px}
.problem span{font-size:12.5px;color:var(--muted)}
.problem[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.iv{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:8px}
.iv-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.iv-head h4{font-size:16.5px}
.suit{font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap;font-weight:600}
.suit.High{background:var(--green-soft);color:var(--green)} .suit.Medium{background:var(--warn-soft);color:var(--warn)} .suit.Low{background:var(--heat-soft);color:var(--heat)}
.effects{display:flex;flex-wrap:wrap;gap:6px}
.effects span{font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:2px 8px;background:var(--surface2)}
.effects b.good{color:var(--green)} .effects b.bad{color:var(--warn)} .effects b.nil{color:var(--faint)}
.iv ul.reasons{margin:0;padding-left:16px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.iv dl{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;margin:0}
.iv dt{font-family:var(--f-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.iv dd{margin:0 0 4px;font-size:13.5px}
.cmpcheck{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.cmpcheck input{accent-color:var(--teal)}
.slider{display:grid;grid-template-columns:minmax(0,1fr) 80px;gap:4px 10px;align-items:center;font-size:13.5px}
.slider input{grid-column:1/-1;accent-color:var(--violet);width:100%}
.slider output{font-family:var(--f-mono);text-align:right;color:var(--violet)}
.slider small{grid-column:1/-1;color:var(--muted);font-size:12px;margin-top:-2px}
.presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.presets button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px;text-align:left;cursor:pointer;font-size:12.5px;color:var(--muted)}
.presets button b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:2px}
.presets button[aria-pressed="true"]{border-color:var(--violet);background:var(--violet-soft)}
.better{color:var(--green)} .worse{color:var(--warn)}

/* ---- glossary info icons ---- */
.gt{white-space:nowrap}
.gi{display:inline-grid;place-items:center;width:17px;height:17px;margin:0 1px 0 3px;padding:0;border-radius:50%;border:1px solid var(--line2);background:var(--surface);color:var(--teal);cursor:help;vertical-align:1px;line-height:1;flex:none;transition:background .15s,color .15s,border-color .15s,transform .15s}
.gi svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.gi:hover,.gi[aria-expanded="true"]{background:var(--teal);color:#fff;border-color:var(--teal);transform:scale(1.08)}
.gi:focus-visible{outline-offset:1px;border-radius:50%}
#gpop{position:fixed;z-index:120;width:min(300px,calc(100vw - 24px));background:rgba(255,255,255,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lift);padding:12px 13px;font-size:13px;line-height:1.45;animation:pop .18s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.98)}to{opacity:1;transform:none}}
#gpop b.gn{display:block;font-family:var(--f-display);font-size:15px;margin-bottom:4px}
#gpop p{margin:0 0 5px;color:var(--ink)}
#gpop p.gs{color:var(--muted);font-size:12.5px}
#gpop p.ge{margin:6px 0 0;padding-top:6px;border-top:1px solid var(--line);color:var(--teal-deep);font-size:12.5px}
#gpop .gk{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-right:4px}
/* glossary drawer */
.scrim{position:fixed;inset:0;z-index:110;background:rgba(14,42,47,.28);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;z-index:111;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--page);box-shadow:-20px 0 60px rgba(14,42,47,.2);display:flex;flex-direction:column;animation:slidein .35s var(--ease);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
@keyframes slidein{from{transform:translateX(30px);opacity:0}}
.drawer header{display:flex;flex-direction:column;gap:10px;padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.drawer header .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.drawer header h2{font-size:24px;display:flex;gap:9px;align-items:center}
.drawer .search input{padding-left:38px}
.drawer .list{overflow:auto;padding:12px 18px 30px;display:flex;flex-direction:column;gap:8px}
.gentry{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;flex-direction:column;gap:3px}
.gentry h3{font-size:15.5px}
.gentry p{font-size:13.5px}
.gentry .gs{color:var(--muted);font-size:12.5px}
.gentry .ge{color:var(--teal-deep);font-size:12.5px}
.closebtn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.closebtn:hover{border-color:var(--teal);color:var(--teal)}

/* skeletons */
.skel{display:flex;flex-direction:column;gap:9px}
.sk{height:12px;border-radius:7px;background:linear-gradient(90deg,#E4ECEE 0%,#F4F8F9 45%,#E4ECEE 90%);background-size:220% 100%;animation:shimmer 1.3s linear infinite}
.sk.h{height:26px;width:60%}.sk.b{height:120px;border-radius:12px}.sk.w70{width:70%}.sk.w40{width:40%}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-100% 0}}
.skelcap{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.skelcap i{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:blink 1.1s infinite}

/* climate stripes */
.stripes{display:flex;flex-direction:column;gap:4px;margin-top:2px}
.stripes .srow{position:relative;height:30px;border-radius:9px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(14,42,47,.08);cursor:pointer}
.stripes .srow:focus-visible{outline:2.5px solid var(--teal);outline-offset:2px}
.stripes svg{width:100%;height:100%;display:block}
.stripes .slab{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:10px;color:var(--muted);flex-wrap:wrap}
/* lifetime lens */
.lifetime{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.6)}
.lifetime input{width:86px;padding:4px 8px}
.lifetime b{color:var(--ink)}
.lifeline{font-size:12.5px;color:var(--teal-deep);background:var(--teal-soft);border-radius:9px;padding:5px 9px;display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
/* insight cards */
.feed{display:flex;flex-direction:column;gap:10px}
.insight{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.insight::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--ic,var(--line2))}
.insight .top{display:grid;grid-template-columns:40px minmax(0,1fr) 92px;gap:12px;align-items:center}
.insight .ibox{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--icbg,var(--surface2));color:var(--ic,var(--muted))}
.insight .ibox .ic{width:21px;height:21px}
.insight .ttl{min-width:0;display:flex;flex-direction:column;gap:2px}
.insight .ttl b{font-size:14.5px}
.insight .rank{font-family:var(--f-mono);font-size:10px;color:var(--faint);letter-spacing:.08em}
.insight .num{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.insight .num .big{font-family:var(--f-display);font-weight:750;font-size:34px;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.insight .num .u{font-size:14px;font-weight:600;color:var(--muted)}
.insight .num .rate{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.insight svg.spark{width:92px;height:40px;display:block}
.insight.warm{--ic:var(--heat);--icbg:var(--heat-soft)} .insight.cool{--ic:var(--cool);--icbg:var(--cool-soft)} .insight.dry{--ic:var(--dry);--icbg:var(--sand)} .insight.neutral{--ic:var(--faint);--icbg:var(--surface2)}
/* fingerprint & rank */
.fp{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:center}
.fp svg{width:100%;max-width:260px;height:auto;display:block;margin:0 auto}
.fp .headline{font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1.15;letter-spacing:-.02em}
.fp ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.fp li{display:flex;gap:7px;align-items:center}
.fp li i{width:9px;height:9px;border-radius:50%;flex:none}
.fp li span.v{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;white-space:nowrap}
.rankstrip svg{width:100%;height:auto;display:block;overflow:visible}
.rankstrip .dot{cursor:pointer}
.rankstrip .dot:focus-visible{outline:none}
.rankstrip .dot:focus-visible circle{stroke:var(--teal);stroke-width:3}
/* story */
.story{position:absolute;z-index:40;left:calc(var(--leftW) + 32px);right:calc(var(--panelW) + 32px);bottom:104px;margin:0 auto;max-width:560px;padding:16px 18px 14px;display:flex;flex-direction:column;gap:10px;animation:rise .45s var(--ease)}
.story .shead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.story .step{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-deep)}
.story h3{font-size:22px}
.story p{font-size:14.5px}
.story .sci{font-size:12.5px;color:var(--muted)}
.story .sfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots button{width:9px;height:9px;border-radius:50%;border:0;padding:0;background:var(--line2);cursor:pointer;transition:width .3s var(--ease),background .3s}
.dots button[aria-current="step"]{width:24px;border-radius:5px;background:var(--teal)}
/* time-lapse */
.lapse{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.lapse{grid-template-columns:minmax(0,1fr)}}
.lapse .ctlrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lapse input[type=range]{flex:1;min-width:120px;accent-color:var(--teal)}
.stamp{position:absolute;right:10px;bottom:10px;font-family:var(--f-mono);font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(14,42,47,.78);color:#fff}

/* before & after section (below the map) */
.compare{padding:34px max(16px,env(safe-area-inset-left,0px)) 56px max(16px,env(safe-area-inset-right,0px));position:relative}
.compare::before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent)}
.compare .wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.cmp-head{display:flex;justify-content:space-between;gap:14px 24px;flex-wrap:wrap;align-items:flex-end}
.cmp-head h2{font-size:32px;letter-spacing:-.025em}
.cmp-head p{color:var(--muted);margin-top:4px;max-width:62ch}
.cmp-ctl{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;font-size:14px}
.cmp-ctl label{color:var(--muted);font-size:13px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:760px){.pair{grid-template-columns:minmax(0,1fr)}}
figure{margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.imgbox{position:relative;width:100%;max-width:100%;border-radius:var(--r);overflow:hidden;background:linear-gradient(135deg,#E3ECEE,#D5E2E4);border:1px solid var(--line);box-shadow:var(--shadow)}
.imgbox.loading::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);background-size:220% 100%;animation:shimmer 1.3s linear infinite}
.imgbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
.imgbox .ph{position:absolute;inset:0;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:13.5px;color:var(--muted);z-index:2}
.imgbox .yearTag{position:absolute;left:10px;top:10px;font-family:var(--f-display);font-weight:700;font-size:17px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:var(--shadow);z-index:3}
.imgbox .pin{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2.5px solid #fff;background:var(--amber);box-shadow:0 0 0 2px rgba(0,0,0,.25);z-index:3}
figcaption{display:flex;flex-direction:column;gap:8px}
figcaption .cap{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
figcaption .cap b{font-family:var(--f-display);font-size:18px}
.change{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.change{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpis div{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface)}
.kpis .v{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chart .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}

#compare{scroll-margin-top:64px}
@media (max-width:1180px){:root{--leftW:268px;--panelW:396px}}
@media (max-width:900px){
  .workspace{height:auto;min-height:0;max-height:none;display:flex;flex-direction:column}
  #stage,#panel,#compare{scroll-margin-top:118px}
  .stage{position:relative;inset:auto;height:64vh;min-height:400px}
  nav.sections{flex-basis:100%;order:3}
  .hdr-actions{margin-left:auto}
  .cmd{left:12px;right:12px;top:10px}
  .locbtn span{display:none}
  .explore{top:auto;bottom:12px;left:12px;width:min(300px,calc(100% - 76px));max-height:calc(100% - 96px)}
  .zoombtns{right:12px;bottom:12px}
  .timeline{position:relative;left:auto;right:auto;bottom:auto;margin:10px 12px 0;flex-wrap:wrap;gap:8px 12px}
  .timeline .track{flex-basis:100%;order:3}
  .panel{position:relative;right:auto;top:auto;bottom:auto;width:auto;margin:10px 12px 0}
  .panel .scroll{overflow:visible}
  .problems{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .story{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-height:52vh;overflow:auto}
}
@media (max-width:520px){
  .hbtn .t{display:none}
  .hbtn{padding:7px 9px}
  .brand{flex:1;min-width:0;gap:8px}
  .brand b{font-size:16.5px}
  .brand .mark{width:26px;height:26px}
  .brand small{display:none}
  header.top{gap:6px 10px}
  .hero .big{font-size:44px}
  .insight .top{grid-template-columns:36px minmax(0,1fr) 70px}
  .insight svg.spark{width:70px}
  .presets{grid-template-columns:minmax(0,1fr)}
  .timeline .ctl{width:100%}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.chart .draw{stroke-dashoffset:0}}
.apform{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.apform input{flex:1 1 150px;min-width:0;padding:9px 11px;border:1px solid var(--line,#C9D3D6);border-radius:10px;font:inherit;background:var(--card,#fff);color:inherit}
</style>

</head>
<body>
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"></span><div><b>Earth Trend Detective</b><small>NASA Space Apps 2026</small></div></div>
  <nav class="sections" aria-label="Sections">
    <button data-sec="explore" aria-current="page" data-icon="compass">Explore Earth</button>
    <button data-sec="trends" data-icon="trend">Trend Explorer</button>

const fullAnalysis=s=>analyze(s.start,s.vals,s.start+s.vals.findIndex(x=>x!=null),YEAR_END);
function pearson(xa,ya){const n=xa.length;if(n<6)return null;const mx=mean(xa),my=mean(ya);let sxy=0,sxx=0,syy=0;for(let i=0;i<n;i++){sxy+=(xa[i]-mx)*(ya[i]-my);sxx+=(xa[i]-mx)**2;syy+=(ya[i]-my)**2;}const r=sxy/Math.sqrt(sxx*syy);return{r,p:tP(r*Math.sqrt((n-2)/Math.max(1e-12,1-r*r)),n-2),n};}

      - NASA AppEEARS (MODIS, free Earthdata login typed into the page): ts (LST day) and ndvi

const RODS_URL="https://hydro1.gesdisc.eosdis.nasa.gov/daac-bin/access/timeseries.cgi";

/* small shared helpers: a request limiter (Data Rods is slow) and a CSV parser */
const NET={max:6,n:0,q:[]};
function netSlot(){return new Promise(res=>{const go=()=>{NET.n++;res();};NET.n<NET.max?go():NET.q.push(go);});}
function netFree(){NET.n--;const f=NET.q.shift();if(f)f();}

  else if(c==='"')q=true;else if(c===","){row.push(f);f="";}

const AP={auth:null,token:null,exp:0,runs:new Map()};

  const r=await netFetch(APPEARS_URL+"/task",{method:"POST",headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify(body)},60000);

/* AppEEARS writes one results CSV per product, so every results file is read (the extractor script read only the first). */
function monthlyMeans(list,kind){const vals=list.map(o=>o.v);

  const raw=kind==="ndvi"?vals.some(v=>Math.abs(v)>2):vals.some(v=>v>1000);
  const f=kind==="ndvi"?(raw?v=>v>-3000?v*0.0001:null:v=>v>-0.25?v:null):(raw?v=>v>0?v*0.02-273.15:null:v=>v>0?v-273.15:null);
  const acc={};list.forEach(o=>{const x=f(o.v);if(x==null)return;(acc[o.k]=acc[o.k]||[]).push(x);});

async function apCollect(tid,tok){
  const files=(await (await apGet("/bundle/"+tid,tok)).json()).files||[];

  if(!csvs.length)throw new Error("AppEEARS returned no results CSV.");
  const out={ts:blankSeries(),ndvi:blankSeries()};
  for(const f of csvs){const rows=parseCSV(await (await apGet("/bundle/"+tid+"/"+f.file_id,tok,300000)).text());if(rows.length<2)continue;
    const h=rows[0],di=h.indexOf("Date");if(di<0)continue;

function runAppeears(loc,d){const k=locKey(loc);if(AP.runs.has(k))return;
  if(!AP.auth){apSet(d,"auth");return;}
  apSet(d,"running","Signing in to AppEEARS…");
  AP.runs.set(k,(async()=>{
    try{const tok=await apLogin();apSet(d,"running","Submitting the MODIS request…");apText(loc,d);
      const tid=await apTask(loc,tok);
      await apWait(tid,tok,(s,st)=>{apSet(d,"running",`AppEEARS is ${st==="pending"?"queueing":"processing"} the request (${s} s so far, usually a few minutes). This page updates by itself.`);apText(loc,d);});
      apSet(d,"running","Downloading the MODIS results…");apText(loc,d);
      const r=await apCollect(tid,tok);
      ["ts","ndvi"].forEach(id=>{const v=VARS[id];d[id]={start:Y0,vals:r[id].map(x=>x==null?null:+v.conv(x).toFixed(v.dig+1))};});
      apSet(d,"ok");
    }catch(e){const n=e&&e.name;apSet(d,e&&e.auth?"auth":"error",e&&e.auth?e.message:n==="TypeError"?"The browser couldn't reach AppEEARS (network or cross-origin block).":n==="AbortError"?"AppEEARS took too long to answer.":String(e&&e.message||e));}
    AP.runs.delete(k);apRefresh(loc);})());}
/* sign-in / progress card shown where MODIS series are needed */
function apBox(d,ids){if(!d||!d.ok)return"";
  const need=(ids||["ts","ndvi"]).filter(id=>!d[id].vals.some(x=>x!=null));
  const st=d.aps.state;if(st==="ok"&&!need.length)return"";
  const what=(ids||["ts","ndvi"]).map(id=>VARS[id].name.toLowerCase()).join(" and ");
  if(st==="running")return`<div class="note" id="apBox"><b>NASA AppEEARS is preparing MODIS ${esc(what)} for ${esc(S.loc.name)}.</b><br><span id="apMsg">${esc(d.aps.msg)}</span></div>`;
  if(st==="ok")return`<div class="note warn" id="apBox"><b>AppEEARS finished but had no valid ${esc(what)} values for this point.</b> That can happen over open water or under persistent cloud.</div>`;
  if(st==="error")return`<div class="note warn" id="apBox"><b>NASA AppEEARS couldn't deliver MODIS data.</b> <span id="apMsg">${esc(d.aps.msg)}</span><div class="btnrow" style="margin-top:8px"><button class="btn small" id="apRetry">Try again</button><a class="btn small" href="https://appeears.earthdatacloud.nasa.gov/" target="_blank" rel="noopener">Open AppEEARS ↗</a></div></div>`;
  return`<div class="card" id="apBox"><span class="label">NASA AppEEARS · MODIS</span><h3 style="font-size:16px">Sign in to fetch the MODIS series</h3>
   <p class="hint">MODIS land surface temperature and NDVI come from NASA AppEEARS, which needs a free <a href="https://urs.earthdata.nasa.gov/users/new" target="_blank" rel="noopener">Earthdata account</a>. Your login goes only to NASA, stays in this tab's memory and is never saved.${d.aps.msg?` <b>${esc(d.aps.msg)}</b>`:""}</p>
   <div class="apform"><input id="apU" type="text" placeholder="Earthdata username" autocomplete="username" aria-label="Earthdata username"><input id="apP" type="password" placeholder="Password" autocomplete="current-password" aria-label="Earthdata password"><button class="btn primary" id="apGo">Fetch MODIS series</button></div><p class="hint" id="apMsgIn"></p></div>`;}
function bindAp(){const go=$("#apGo");
  if(go){const fire=()=>{const u=$("#apU").value.trim(),p=$("#apP").value;if(!u||!p){$("#apMsgIn").textContent="Enter your Earthdata username and password.";return;}
    const d=S.loc&&peek(S.loc);if(!d)return;AP.auth={u,p};AP.token=null;apSet(d,"idle");runAppeears(S.loc,d);renderPanel();};
    go.onclick=fire;$("#apP").addEventListener("keydown",e=>{if(e.key==="Enter")fire();});}
  const rt=$("#apRetry");if(rt)rt.onclick=()=>{const d=S.loc&&peek(S.loc);if(!d)return;apSet(d,"idle");runAppeears(S.loc,d);renderPanel();};}

/* ---------- NASA GISTEMP v4 (global annual mean anomaly, CSV) ---------- */
async function loadGistemp(){GL.state="loading";
  try{const r=await netFetch(GISTEMP_URL,{},45000);if(!r.ok)throw new Error("http "+r.status);
    const rows=parseCSV(await r.text()),hi=rows.findIndex(x=>x[0]==="Year");if(hi<0)throw new Error("unexpected file format");
    const ji=rows[hi].indexOf("J-D");if(ji<0)throw new Error("no J-D column");
    const by={};rows.slice(hi+1).forEach(x=>{const y=+x[0],v=parseFloat(x[ji]);if(y>=1880&&isFinite(v))by[y]=v;});   /* "***" = not yet available */
    const ys=Object.keys(by).map(Number).sort((a,b)=>a-b);if(ys.length<20)throw new Error("too few years");
    GLOBAL[0].start=ys[0];GLOBAL[0].vals=range(ys[0],ys[ys.length-1]).map(y=>by[y]!=null?by[y]:null);GL.state="ok";
  }catch(e){GL.state="fail";GL.reason=e&&e.name==="TypeError"?"blocked":String(e&&e.message||e);}}
function globalPending(){return`<div class="sec-title" style="margin-top:6px"><h2 style="font-size:20px">The whole planet</h2><p>Real global record from NASA ${gterm("gistemp","GISTEMP")}, fetched live.</p></div>
  ${GL.state==="fail"?`<div class="note warn"><b>NASA GISTEMP couldn't be loaded here.</b> The platform won't substitute invented numbers.<br><a href="${GISTEMP_URL}" target="_blank" rel="noopener">Open the GISTEMP CSV ↗</a></div>`:skeleton("Fetching the GISTEMP record from NASA",["w70","b"])}`;}

function getData(loc){const k=locKey(loc);if(!dataCache.has(k))dataCache.set(k,fetchRods(loc).then(r=>{
  const d={ok:r.ok,status:"live",reason:r.reason,failed:r.failed||[],url:rodsURL(loc,"Tair_f_inst"),aps:{state:"idle",msg:""}};
  VAR_ORDER.forEach(id=>{d[id]={start:Y0,vals:r.vars&&r.vars[id]?r.vars[id]:blankSeries()};});return d;}));return dataCache.get(k);}

function autoGloss(html,max){if(!html)return html;max=max||7;let used=0;const seen=new Set();
  for(const k of GLOSS_KEYS){if(used>=max)break;if(seen.has(k))continue;const re=GLOSS[k].re;const parts=String(html).split(/(<[^>]+>)/);let skip=0,done=false;
    for(let i=0;i<parts.length&&!done;i++){const p=parts[i];if(p.startsWith("<")){if(/^<(a|button|label|select|option|summary|svg|code)[\s>]/i.test(p))skip++;else if(/^<\/(a|button|label|select|option|summary|svg|code)>/i.test(p))skip=Math.max(0,skip-1);continue;}

const q=$("#q"),qs=$("#qs");

  const words=term.split(/[,\s]+/).filter(Boolean);
  const f=FEATURED.filter(p=>{const hay=(p.name+" "+p.country).toLowerCase();return words.every(w=>hay.includes(w));}).map(p=>Object.assign({_t:"Place"},p));
  const c=COUNTRIES.filter(p=>p.name.toLowerCase().includes(words[0])).sort((a,b)=>a.name.toLowerCase().indexOf(words[0])-b.name.toLowerCase().indexOf(words[0])).slice(0,6).map(p=>Object.assign({_t:"Country"},p));

  const p=document.createElement("p");p.id="geoNote";p.textContent="Searching worldwide…";qs.appendChild(p);qs.hidden=false;clearTimeout(geoTimer);geoTimer=setTimeout(()=>geocode(term),400);}
async function geocode(term){const note=$("#geoNote");if(!note)return;if(term.trim().length<3){note.textContent="Type at least 3 letters to search towns and cities worldwide.";return;}
  try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=5&q=${encodeURIComponent(term)}`,{headers:{"Accept-Language":"en"}});if(!r.ok)throw 0;const js=await r.json();if(q.value!==term)return;note.remove();
    js.forEach(g=>{const b=document.createElement("button"),nm=String(g.display_name||"").split(",");b.innerHTML=`<span>${esc(nm[0])}${nm.length>1?", "+esc(nm[nm.length-1].trim()):""}</span><small>Worldwide</small>`;
      b.onclick=()=>pickResult({name:nm[0],country:nm.length>1?nm[nm.length-1].trim():"",lat:+g.lat,lon:+g.lon,kind:"point",urban:/city|town|suburb|administrative/.test(g.type||g.addresstype||"")});qs.appendChild(b);});
    if(!js.length){const p=document.createElement("p");p.textContent="No places found. Try another spelling or coordinates like 30.04, 31.24.";qs.appendChild(p);}}
  catch(_){if(note)note.textContent="Worldwide town search runs on a normal website. Here you can search countries, featured places, or coordinates like 30.04, 31.24.";}}
function pickResult(r){qs.hidden=true;q.value="";q.blur();const loc=r.kind==="featured"?FEATURED.find(f=>f.id===r.id):r.kind==="country"?COUNTRIES.find(c=>c.name===r.name):Object.assign({},r,{id:locKey(r)});selectLocation(loc);}
q.addEventListener("input",renderSugg);q.addEventListener("focus",()=>{if(q.value.trim())renderSugg();});
q.addEventListener("keydown",e=>{if(e.key==="Enter"){const b=qs.querySelector("button");if(b)b.click();}if(e.key==="Escape"){qs.hidden=true;q.blur();}if(e.key==="ArrowDown"){const b=qs.querySelector("button");if(b){e.preventDefault();b.focus();}}});
qs.addEventListener("keydown",e=>{const bs=[...qs.querySelectorAll("button")],i=bs.indexOf(document.activeElement);if(e.key==="ArrowDown"&&i<bs.length-1){e.preventDefault();bs[i+1].focus();}if(e.key==="ArrowUp"){e.preventDefault();(i>0?bs[i-1]:q).focus();}if(e.key==="Escape"){qs.hidden=true;q.focus();}});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))qs.hidden=true;});
$("#locBtn").onclick=()=>{const b=$("#locBtn");if(!("geolocation" in navigator)){flash("This browser can't share your location. Type your city in the search box instead.","warn");q.focus();return;}
  b.disabled=true;flash("Asking your browser for your location…","",15000);
  navigator.geolocation.getCurrentPosition(pos=>{b.disabled=false;const lat=pos.coords.latitude,lon=pos.coords.longitude,c=mapOK?countryAt(lat,lon):null;flash("Found you. Loading NASA data for your area.","ok",4000);
      selectLocation({name:"Your location",country:c?c.name:"",lat:+lat.toFixed(3),lon:+lon.toFixed(3),kind:"point",id:"me"});},
    err=>{b.disabled=false;flash(err&&err.code===1?"Location access wasn't allowed. No problem: type your city in the search box.":"Couldn't get your location here. Type your city in the search box instead.","warn",8000);q.focus();},{timeout:10000,maximumAge:600000});};

/* =====================================================================
   16. SELECTION, NAVIGATION, BOOT
   ===================================================================== */
function selectLocation(loc,opts){if(!loc)return;if(S.loc&&locKey(S.loc)!==locKey(loc))$("#story").hidden=true;S.loc=loc;S.from=Y0;S.to=YEAR_END;saveState();
  const kTarget=kMin*(loc.kind==="country"?2.5:8);
  if(mode==="globe"){if(opts&&opts.fly===false)enterMap(loc.lat,loc.lon,kTarget);else globeTo(loc.lat,loc.lon,G.r0*1.25,900,()=>{enterMap(loc.lat,loc.lon,kMin*1.6);flyTo(loc.lat,loc.lon,kTarget,1100);});}
  else if(!(opts&&opts.fly===false))flyTo(loc.lat,loc.lon,Math.max(T.k,kTarget));
  drawMap();if(S.section==="about")S.section="explore";renderPanel();renderCompare();refreshStatus();
  load(loc).then(()=>{drawMap();renderExploreList();renderCompare();});
  if(window.innerWidth<=900)setTimeout(()=>$("#panel").scrollIntoView({behavior:"smooth",block:"start"}),1200);}
$$("nav.sections button").forEach(b=>b.onclick=()=>{S.section=b.dataset.sec;renderPanel();positionInk();if(window.innerWidth<=900)$("#panel").scrollIntoView({behavior:"smooth",block:"start"});});
function boot(){
  yr.min=Y0;yr.max=YEAR_END;loadGistemp().then(()=>{if(apIdle())renderPanel();});
  if(saved.item&&EXPLORE.find(e=>e.id===saved.item))S.item=saved.item;
  if(window.innerWidth<=900||window.innerHeight<700){$("#explore").classList.add("collapsed");$("#exploreToggle").textContent="Show";$("#exploreToggle").setAttribute("aria-expanded","false");}
  hydrateIcons(document);$("#play").innerHTML=icon("play");G.intro=reduceMotion?0:performance.now();
  buildGlobeGeo();renderTicks();renderExploreList();sizeView();sizeMap();
  new ResizeObserver(()=>{sizeView();sizeMap();if(mode==="map")drawMap();}).observe(stage);
  requestAnimationFrame(globeLoop);updateGlobeTexture();
  (async()=>{const list=FEATURED.slice(),worker=async()=>{while(list.length){const p=list.shift();await load(p);if(mode==="map")drawMarks();}};await Promise.all([worker(),worker(),worker()]);if(mode==="map")drawMarks();if(S.section==="trends"||S.section==="connect")renderPanel();})();
  const prev=saved.loc,fromHash=parseHash(location.hash);
  if(fromHash){applyHash(fromHash);}
  else if(prev&&isFinite(prev.lat)){const f=FEATURED.find(x=>x.name===prev.name)||COUNTRIES.find(c=>c.name===prev.name)||Object.assign({id:locKey(prev)},prev);S.loc=f;G.rot=[-f.lon,clamp(-f.lat,-80,80)];G.spin=false;renderPanel();load(f).then(()=>{renderPanel();renderCompare();});}
  else renderPanel();
  renderCompare();setYear(S.year,{light:true});refreshStatus();requestAnimationFrame(positionInk);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(positionInk);
}
try{boot();}catch(e){console.error(e);const m=$("#msg");m.hidden=false;m.className="msg warn";m.textContent="Something went wrong while starting: "+(e&&e.message);}
})();
</script>
